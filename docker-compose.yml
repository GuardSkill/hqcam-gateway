# =============================================================================
# 海雀摄像头本地化网关 · docker compose
#
# 1) 复制环境变量模板并填写你的信息：
#      cp .env.example .env && vi .env
# 2) 启动：
#      docker compose up -d
# 3) 看日志：
#      docker compose logs -f
#
# 镜像里没有任何个人信息；你的账号/密码/设备 ID 只存在于本机 .env。
# =============================================================================

services:
  hqcam-gateway:
    # 用已发布到 GHCR 的镜像（推荐）：
    image: ${HQ_IMAGE:-ghcr.io/your-github-name/hqcam-gateway:latest}
    # 想本地构建就注释掉上面 image、打开下面 build：
    # build: .
    container_name: hqcam-gateway
    restart: unless-stopped
    ports:
      # 宿主端口:容器端口(固定 8899)
      - "${HQ_HTTP_PORT:-8899}:8899"
    environment:
      # ---- 必填（来自 .env）----
      HQ_USER:   ${HQ_USER:?请在 .env 里设置 HQ_USER}
      HQ_PASS:   ${HQ_PASS:?请在 .env 里设置 HQ_PASS}
      HQ_DEVICE: ${HQ_DEVICE:?请在 .env 里设置 HQ_DEVICE}
      HQ_APPDID: ${HQ_APPDID:?请在 .env 里设置 HQ_APPDID}
      # ---- 可选 ----
      HQ_TOKEN:  ${HQ_TOKEN:-}
      HQ_PORT:   "8899"
      HQ_HOST:   "0.0.0.0"
      TZ:        ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/data
    # 给容器足够时间完成云端登录 + relay 握手
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys,os;u='http://127.0.0.1:8899/status.json';t=os.environ.get('HQ_TOKEN','');u=u+('?token='+t if t else '');sys.exit(0 if urllib.request.urlopen(u,timeout=5).getcode()==200 else 1)\""]
      interval: 30s
      timeout: 6s
      start_period: 25s
      retries: 3

  # ---------------------------------------------------------------------------
  # 可选：分段录像（默认不启动）
  #   docker compose --profile recorder up -d
  # 录像位置由 .env 的 HQ_REC_HOST_DIR 指定（可以指向另一块盘，例如 /vol2/1000/hqcam-rec）
  # 默认保留 3 天滚动覆盖
  # ---------------------------------------------------------------------------
  hqcam-recorder:
    image: ${HQ_IMAGE:-ghcr.io/your-github-name/hqcam-gateway:latest}
    # build: .
    container_name: hqcam-recorder
    profiles: ["recorder"]
    restart: unless-stopped
    depends_on:
      - hqcam-gateway
    # 录像文件的属主必须和宿主目录一致，否则写不进去。
    # fnOS 的 /vol1/1000、/vol2/1000 属 uid=1000 gid=1001 → 默认 1000:1001
    user: "${HQ_REC_UID:-1000}:${HQ_REC_GID:-1001}"
    environment:
      HQ_ROLE: recorder
      HQ_PORT: "8899"
      # 录像器也要带上访问令牌才能从网关拉流（留空则网关未开鉴权）
      HQ_TOKEN: ${HQ_TOKEN:-}
      HQ_REC_URL: "http://hqcam-gateway:8899/av.ts"
      HQ_REC_OUT: /rec
      # 每段秒数（300 = 5 分钟一段）
      HQ_REC_SEG: ${HQ_REC_SEG:-300}
      # 滚动保留：超过 3 天 或 超过容量上限 或 磁盘可用不足，都会删最旧的
      HQ_REC_KEEP_DAYS: ${HQ_REC_KEEP_DAYS:-3}
      HQ_REC_KEEP_GB: ${HQ_REC_KEEP_GB:-0}
      HQ_REC_MIN_FREE_GB: ${HQ_REC_MIN_FREE_GB:-10}
      HQ_REC_CLEANUP_EVERY: ${HQ_REC_CLEANUP_EVERY:-300}
      HQ_REC_MKV: ${HQ_REC_MKV:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 录像落盘位置：改 .env 的 HQ_REC_HOST_DIR（宿主路径）即可
      - ${HQ_REC_HOST_DIR:-./data/rec}:/rec

  # ---------------------------------------------------------------------------
  # 可选：Home Assistant MQTT 桥（默认不启动）
  #   docker compose --profile bridge up -d
  # ---------------------------------------------------------------------------
  hqcam-bridge:
    image: ${HQ_IMAGE:-ghcr.io/your-github-name/hqcam-gateway:latest}
    # build: .
    container_name: hqcam-bridge
    profiles: ["bridge"]
    restart: unless-stopped
    depends_on:
      - hqcam-gateway
    environment:
      HQ_ROLE: bridge
      HQ_PORT: "8899"
      # MQTT 桥也要带上访问令牌才能调用网关
      HQ_TOKEN: ${HQ_TOKEN:-}
      HQ_GW: "http://hqcam-gateway:8899"
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASS: ${MQTT_PASS:-}
      MQTT_SNAP_INTERVAL: ${MQTT_SNAP_INTERVAL:-10}
      TZ: ${TZ:-Asia/Shanghai}
